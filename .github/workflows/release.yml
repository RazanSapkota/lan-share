name: Release

# Fires when you publish a release in the GitHub UI:
#   Releases -> Draft a new release -> choose/create a tag, target `main` -> Publish
#
# The `release` event checks out the tag, so what gets built is exactly what the
# release points at -- not whatever `main` happens to be by the time CI runs.
on:
  release:
    types: [published]
  # Rehearse the whole build without cutting a release. Artifacts land on the
  # Actions run instead of on a release page.
  workflow_dispatch:

permissions:
  # Needed to upload assets onto the release. Without it `gh release upload`
  # fails with a 403 that reads like an auth problem but is a scope problem.
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Four files carry the version. `npm run version:set` writes all four, so
      # in practice this now catches a forgotten bump rather than a partial one
      # -- but it checks each file separately anyway, because a file left behind
      # is evidence the script was not what wrote them. Failing here costs 20
      # seconds; failing to notice ships an installer whose "Add or remove
      # programs" entry disagrees with the release it came from.
      - name: Check the tag matches the version in the manifests
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''

          # Only the first two decide what ships: Cargo.toml is CARGO_PKG_VERSION,
          # which the app reports to peers and browsers, and tauri.conf.json is
          # the Windows version resource -- tauri-build reads that field and has
          # no Cargo.toml fallback for it.
          $lockLine = (Select-String src-tauri/Cargo.lock -Pattern '^name = "lan_share_tauri"' -Context 0, 1 |
                       Select-Object -First 1).Context.PostContext[0]

          $found = [ordered]@{
            'src-tauri/Cargo.toml'      = (Select-String src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' |
                                           Select-Object -First 1).Matches[0].Groups[1].Value
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'src-tauri/Cargo.lock'      = ([regex]'"([^"]+)"').Match($lockLine).Groups[1].Value
            'package.json'              = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }

          $found.GetEnumerator() | ForEach-Object { Write-Host ("{0,-28} {1}" -f $_.Key, $_.Value) }
          Write-Host ("{0,-28} {1}" -f 'tag', $tag)

          $wrong = @($found.GetEnumerator() | Where-Object { $_.Value -ne $tag } | ForEach-Object { $_.Key })
          if ($wrong) {
            throw "Version mismatch in: $($wrong -join ', '). Run 'npm run version:set -- $tag', commit, push, then re-publish the release."
          }

      - uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is committed, so this cache is a real hit rather than a
      # best-effort one. Cuts a cold ~12 minute build to roughly 3.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Prebuilt binary. `cargo install tauri-cli` would compile the CLI from
      # source on every run, which costs more than the app build does.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install the Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      # There is no frontend build step -- `frontendDist` is the static ui/
      # folder and `beforeBuildCommand` is empty -- so this needs no Node at all.
      - name: Build
        run: cargo tauri build

      - name: Collect the artifacts
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null

          # The bundler names this one; the cargo binary is named after the
          # crate (`lan_share_tauri`), which is not what anyone wants to see on
          # a download button.
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" dist/
          Copy-Item "src-tauri/target/release/lan_share_tauri.exe" "dist/LAN-Share-$v-portable-x64.exe"

          Get-ChildItem dist | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          # One call per file: neither gh nor PowerShell expands a glob for a
          # native command, so `dist/*` would be uploaded as a literal filename.
          Get-ChildItem dist | ForEach-Object {
            Write-Host "uploading $($_.Name)"
            gh release upload $tag $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload failed for $($_.Name)" }
          }

      # A manual run has no release to attach to, so keep the build reachable.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: lan-share-windows
          path: dist/
