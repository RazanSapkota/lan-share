<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values on notched iPhones; without it the bottom bar sits under the
         home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="referrer" content="no-referrer" />
    <title>LAN Share</title>
    <!-- No Google Fonts, no CDN, no external anything: the phone on the other
         end may have zero internet access and only be able to reach this host. -->
    <link rel="stylesheet" href="/assets/styles.css?v=__REV__" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <!-- ===================== Offline / error banner ===================== -->
    <div id="banner" class="banner hidden" role="status" aria-live="polite">
      <span id="banner-text"></span>
      <button id="banner-retry" class="banner-btn" type="button">Retry</button>
    </div>

    <!-- ========================== PIN gate ============================== -->
    <section id="screen-pin" class="screen screen-pin hidden">
      <div class="pin-card">
        <div class="pin-mark" aria-hidden="true"></div>
        <h1 class="pin-title">LAN Share</h1>
        <p class="pin-sub" id="pin-host">Enter the PIN shown on the host</p>

        <form id="pin-form" autocomplete="off">
          <input
            id="pin-input"
            class="pin-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="12"
            autocomplete="one-time-code"
            placeholder="••••••"
            aria-label="PIN"
          />
          <button id="pin-submit" class="btn btn-primary btn-block" type="submit">Connect</button>
        </form>

        <p id="pin-error" class="pin-error" role="alert" aria-live="assertive"></p>
      </div>
    </section>

    <!-- ======================== Share picker ============================ -->
    <section id="screen-shares" class="screen hidden">
      <header class="topbar">
        <div class="topbar-row">
          <div class="brand">
            <span class="brand-dot" aria-hidden="true"></span>
            <span class="brand-name" id="server-name">LAN Share</span>
          </div>
          <button id="logout-btn" class="icon-btn" type="button" aria-label="Sign out" title="Sign out. This device has to enter the PIN again." data-icon="logout"></button>
        </div>
      </header>
      <main class="shares-main">
        <h2 class="section-title">Shared with you</h2>
        <div id="shares-list" class="shares-list"></div>
        <div id="shares-empty" class="empty hidden">
          <div class="empty-icon" data-icon="folder"></div>
          <p class="empty-title">Nothing shared yet</p>
          <p class="empty-sub">The host hasn't added any folders.</p>
          <button class="btn" type="button" data-action="reload-shares">Check again</button>
        </div>
      </main>
    </section>

    <!-- ========================== Browser =============================== -->
    <section id="screen-browse" class="screen hidden">
      <header class="topbar">
        <div class="topbar-row">
          <button id="back-btn" class="icon-btn" type="button" aria-label="Back" title="Up one folder" data-icon="back"></button>
          <div class="crumbs" id="crumbs"></div>
          <button id="view-btn" class="icon-btn" type="button" aria-label="Toggle view" title="Switch between gallery and list" data-icon="list"></button>
          <button id="search-btn" class="icon-btn" type="button" aria-label="Search" title="Filter the files in this folder" data-icon="search"></button>
        </div>
        <div class="topbar-row topbar-search hidden" id="search-row">
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Filter files in this folder"
            aria-label="Filter files"
          />
          <select id="sort-select" class="sort-select" aria-label="Sort by">
            <option value="name">Name</option>
            <option value="size">Size</option>
            <option value="date">Date</option>
            <option value="kind">Type</option>
          </select>
        </div>
      </header>

      <main id="browse-main" class="browse-main">
        <div id="grid" class="grid" role="list"></div>
        <div id="list" class="list hidden" role="list"></div>
        <div id="sentinel" class="sentinel" aria-hidden="true"></div>

        <div id="browse-empty" class="empty hidden">
          <div class="empty-icon" data-icon="folder"></div>
          <p class="empty-title" id="browse-empty-title">This folder is empty</p>
          <p class="empty-sub" id="browse-empty-sub"></p>
          <button class="btn hidden" type="button" id="browse-empty-action">Clear filter</button>
        </div>

        <div id="browse-loading" class="grid skeletons hidden" aria-hidden="true"></div>
      </main>

      <div class="bottombar" id="bottombar">
        <span class="bottom-stat" id="folder-stat"></span>
        <div class="bottom-actions">
          <button id="zip-btn" class="btn btn-sm hidden" type="button">Download folder</button>
          <button id="upload-btn" class="btn btn-sm btn-primary hidden" type="button">Upload</button>
        </div>
      </div>
    </section>

    <!-- ====================== Viewer / lightbox ========================= -->
    <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true" aria-label="Media viewer">
      <div class="viewer-bar">
        <button id="viewer-close" class="icon-btn icon-btn-light" type="button" aria-label="Close" title="Close (Esc)" data-icon="close"></button>
        <span class="viewer-name" id="viewer-name"></span>
        <a id="viewer-download" class="icon-btn icon-btn-light" href="#" aria-label="Download" title="Save this file to your device" data-icon="download"></a>
      </div>
      <button id="viewer-prev" class="viewer-nav viewer-prev" type="button" aria-label="Previous" title="Previous file" data-icon="chevron-left"></button>
      <div class="viewer-stage" id="viewer-stage"></div>
      <button id="viewer-next" class="viewer-nav viewer-next" type="button" aria-label="Next" title="Next file" data-icon="chevron-right"></button>
      <div class="viewer-meta" id="viewer-meta"></div>
    </div>

    <!-- ========================= Upload sheet =========================== -->
    <div id="upload-sheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-label="Upload files">
      <div class="sheet">
        <div class="sheet-head">
          <h3 class="sheet-title" id="upload-title">Send files</h3>
          <button id="upload-close" class="icon-btn" type="button" aria-label="Close" title="Close without uploading" data-icon="close"></button>
        </div>
        <div class="sheet-body">
          <label class="dropzone" id="dropzone">
            <span class="dropzone-icon" data-icon="upload"></span>
            <span class="dropzone-text">Choose files</span>
            <input id="upload-input" type="file" multiple hidden />
          </label>
          <div id="upload-queue" class="upload-queue"></div>
        </div>
        <div class="sheet-foot">
          <button id="upload-start" class="btn btn-primary btn-block" type="button" disabled>Upload</button>
        </div>
      </div>
    </div>

    <div id="toasts" class="toast-host" aria-live="polite" aria-atomic="false"></div>

    <script src="/assets/app.js?v=__REV__"></script>
  </body>
</html>
